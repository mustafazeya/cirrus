name: Refresh Documentation Index

on:
  schedule:
    # Run on the 1st of every month at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      create_index:
        description: 'Create index if it does not exist'
        required: false
        type: boolean
        default: false

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd scripts
          pip install aiohttp beautifulsoup4 azure-search-documents lxml
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.CDX_ADMIN_CLIENT_ID }}","clientSecret":"${{ secrets.CDX_ADMIN_CLIENT_SECRET }}","subscriptionId":"24832578-1a71-4345-9035-e3979ac8f9a3","tenantId":"5581c9a8-168b-45f0-abd4-d375da99bf9f"}'
      
      - name: Get Azure Search Key
        id: search
        run: |
          SEARCH_KEY=$(az search admin-key show \
            --resource-group cloudex-shared-rg \
            --service-name cloudex-shared-search \
            --query primaryKey -o tsv)
          echo "::add-mask::$SEARCH_KEY"
          echo "key=$SEARCH_KEY" >> $GITHUB_OUTPUT
      
      - name: Refresh Documentation Index
        run: |
          cd scripts
          python3 crawl_microsoft_docs.py \
            --endpoint "https://cloudex-shared-search.search.windows.net" \
            --key "${{ steps.search.outputs.key }}" \
            --index "microsoft-docs" \
            ${{ inputs.create_index && '--create-index' || '' }}
        env:
          PYTHONUNBUFFERED: 1
      
      - name: Summary
        run: |
          echo "✅ Documentation index refresh completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Search Service: cloudex-shared-search" >> $GITHUB_STEP_SUMMARY
          echo "- Index Name: microsoft-docs" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
