name: Terraform Test Environment

on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        description: Should terraform apply also run?
        required: false
        default: false
  push:
    branches:
      - main
      - dev-to-production-mvp
    paths:
      - 'terraform/environments/test/**'
      - 'terraform/modules/cloudex/**'

jobs:
  deploy-test:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: flysas-tech/cdx-reusable-workflows/.github/workflows/deploy-terraform.yml@v0.1.6
    with:
      name: "cloudex-test"
      environment: "test"
      terraform_folder: terraform/environments/test
      apply: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-to-production-mvp') || (github.event.inputs.apply == 'true') }}
    secrets:
      AZURE_CLIENT_ID: "${{ secrets.CDX_ADMIN_CLIENT_ID }}"
      AZURE_CLIENT_SECRET: "${{ secrets.CDX_ADMIN_CLIENT_SECRET }}"
