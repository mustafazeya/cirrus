name: Deploy Backend and Frontend

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (must deploy test before prod)'
        required: true
        type: choice
        options:
          - test
          - prod
      deploy_backend:
        description: 'Deploy backend?'
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend?'
        required: false
        type: boolean
        default: true

env:
  AZURE_REGION: swedencentral

jobs:
  # Detect changes to determine what to deploy
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.determine.outputs.backend }}
      frontend: ${{ steps.determine.outputs.frontend }}
      test_environment: ${{ steps.set-env.outputs.test_environment }}
      prod_environment: ${{ steps.set-env.outputs.prod_environment }}
      is_main_branch: ${{ steps.set-env.outputs.is_main_branch }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
      
      - name: Set Environment Strategy
        id: set-env
        run: |
          IS_MAIN="${{ github.ref == 'refs/heads/main' }}"
          IS_WORKFLOW_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          
          echo "is_main_branch=$IS_MAIN" >> $GITHUB_OUTPUT
          
          if [[ "$IS_WORKFLOW_DISPATCH" == "true" ]]; then
            # Manual trigger - for prod, always deploy test first
            if [[ "${{ inputs.environment }}" == "prod" ]]; then
              echo "test_environment=true" >> $GITHUB_OUTPUT
              echo "prod_environment=true" >> $GITHUB_OUTPUT
            else
              echo "test_environment=true" >> $GITHUB_OUTPUT
              echo "prod_environment=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "$IS_MAIN" == "true" ]]; then
            # Main branch - deploy to test first, then prod with approval
            echo "test_environment=true" >> $GITHUB_OUTPUT
            echo "prod_environment=true" >> $GITHUB_OUTPUT
          else
            # Non-main branch - only test environment on push
            echo "test_environment=true" >> $GITHUB_OUTPUT
            echo "prod_environment=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Determine what to deploy
        id: determine
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=${{ inputs.deploy_backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
          fi
          
          echo "📋 Deployment Summary:"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Event: ${{ github.event_name }}"
          echo "  Backend changes: ${{ steps.filter.outputs.backend }}"
          echo "  Frontend changes: ${{ steps.filter.outputs.frontend }}"
          echo "  Will deploy backend: $([ '${{ steps.filter.outputs.backend }}' == 'true' ] && echo 'YES' || echo 'NO')"
          echo "  Will deploy frontend: $([ '${{ steps.filter.outputs.frontend }}' == 'true' ] && echo 'YES' || echo 'NO')"
          echo "  Target environment(s): $([ '${{ github.ref }}' == 'refs/heads/main' ] && echo 'TEST → PROD' || echo 'TEST only')"

  # Deploy Backend to TEST
  deploy-backend-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
      id-token: write
    if: |
      needs.detect-changes.outputs.test_environment == 'true' &&
      needs.detect-changes.outputs.backend == 'true'
    environment: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.CDX_ADMIN_CLIENT_ID }}","clientSecret":"${{ secrets.CDX_ADMIN_CLIENT_SECRET }}","subscriptionId":"c85f8672-5f6a-4bf4-b572-b3a3de8e8a00","tenantId":"5581c9a8-168b-45f0-abd4-d375da99bf9f"}'
      
      - name: Login to ACR
        run: |
          az acr login --name $(echo "cloudextestacr.azurecr.io" | cut -d'.' -f1)
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=cloudextestacr.azurecr.io/cloudex-backend
          
          docker build \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            -t ${IMAGE_NAME}:test-latest \
            --cache-from ${IMAGE_NAME}:test-latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            ./backend
          
          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:test-latest
      
      - name: Deploy to Container App (TEST)
        run: |
          IMAGE_TAG=${{ github.sha }}
          ACR_LOGIN=cloudextestacr.azurecr.io
          RG_NAME=cloudex-test-rg
          CA_NAME=cloudex-test-backend-ca
          KV_URI=https://cloudex-test-kv.vault.azure.net/
          IDENTITY_ID=/subscriptions/c85f8672-5f6a-4bf4-b572-b3a3de8e8a00/resourcegroups/cloudex-test-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/cloudex-test-backend-id
          SUBSCRIPTION_ID=c85f8672-5f6a-4bf4-b572-b3a3de8e8a00
          SEARCH_ENDPOINT=https://cloudex-shared-search.search.windows.net
          AI_ENDPOINT=https://cloudex-shared-ai.openai.azure.com/
          BACKEND_SP_CLIENT_ID=3910a773-427b-45c7-99a9-f270b3ce7a3e
          
          # Non-sensitive environment variables
          CORS_ORIGINS="http://localhost:3000,https://cloudex.test.flysas.tech,https://hangar.flysas.tech"
          

          echo " Setting secrets in Container App secret store..."
          az containerapp secret set \
            --name $CA_NAME \
            --resource-group $RG_NAME \
            --secrets \
              openai-api-key="keyvaultref:${KV_URI}secrets/openai-api-key,identityref:${IDENTITY_ID}" \
              azure-search-key="keyvaultref:${KV_URI}secrets/azure-search-key,identityref:${IDENTITY_ID}" \
              redis-url="keyvaultref:${KV_URI}secrets/redis-url,identityref:${IDENTITY_ID}" \
              appinsights-connection-string="keyvaultref:${KV_URI}secrets/appinsights-connection-string,identityref:${IDENTITY_ID}" \
              backend-sp-client-secret="keyvaultref:${KV_URI}secrets/backend-sp-client-secret,identityref:${IDENTITY_ID}"
          
          echo "🚀 Deploying backend to TEST Container App..."
          az containerapp update \
            --name $CA_NAME \
            --resource-group $RG_NAME \
            --image ${ACR_LOGIN}/cloudex-backend:${IMAGE_TAG} \
            --replace-env-vars \
              "AZURE_TENANT_ID=5581c9a8-168b-45f0-abd4-d375da99bf9f" \
              "AZURE_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}" \
              "AZURE_SERVICE_PRINCIPAL_CLIENT_ID=${BACKEND_SP_CLIENT_ID}" \
              "AZURE_SERVICE_PRINCIPAL_TENANT_ID=5581c9a8-168b-45f0-abd4-d375da99bf9f" \
              "OPENAI_API_BASE=${AI_ENDPOINT}" \
              "OPENAI_DEPLOYMENT_NAME=gpt-5.4" \
              "OPENAI_API_VERSION=2024-12-01-preview" \
              "AZURE_SEARCH_ENDPOINT=${SEARCH_ENDPOINT}" \
              "AZURE_SEARCH_INDEX_NAME=microsoft-docs" \
              "USE_AZURE_SEARCH=true" \
              "RESOURCE_GROUP_NAME=${RG_NAME}" \
              "KEY_VAULT_NAME=cloudex-test-kv" \
              "KEY_VAULT_URI=${KV_URI}" \
              "REDIS_URL=secretref:redis-url" \
              "WORKSPACE_ID=2a9a2352-3b5a-4873-bf91-7330104a066c" \
              "ADMIN_ROLE_NAME=Admin" \
              "CLOUDFLARE_SUBSCRIPTION_ID=05e3b5d3-530f-4016-bd79-76743afe424f" \
              "CLOUDFLARE_WORKSPACE_ID=/subscriptions/05e3b5d3-530f-4016-bd79-76743afe424f/resourceGroups/sas-weu-mms-prod-rg/providers/Microsoft.OperationalInsights/workspaces/sasweuomworkspace" \
              "CORS_ORIGINS=${CORS_ORIGINS}" \
              "API_BASE_URL=https://cloudex-api.test.flysas.tech" \
              "CACHE_TTL=300" \
              "PREFETCH_INTERVAL_MINUTES=210" \
              "PREFETCH_CACHE_TTL_SECONDS=14400" \
              "ACCESS_TOKEN_EXPIRE_MINUTES=60" \
              "API_VERSION=v1" \
              "LOG_LEVEL=INFO" \
              "ENVIRONMENT=test" \
              "OPENAI_API_KEY=secretref:openai-api-key" \
              "AZURE_SEARCH_KEY=secretref:azure-search-key" \
              "APPINSIGHTS_CONNECTION_STRING=secretref:appinsights-connection-string" \
              "AZURE_SERVICE_PRINCIPAL_CLIENT_SECRET=secretref:backend-sp-client-secret" \
            --revision-suffix "test-r${{ github.run_number }}"
      
      - name: Verify Deployment (TEST)
        run: |
          CA_NAME=cloudex-test-backend-ca
          RG_NAME=cloudex-test-rg
          
          echo "✅ TEST Backend deployed successfully!"
          az containerapp show \
            --name $CA_NAME \
            --resource-group $RG_NAME \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv

  # Deploy Frontend to TEST
  deploy-frontend-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
      id-token: write
    if: |
      needs.detect-changes.outputs.test_environment == 'true' &&
      needs.detect-changes.outputs.frontend == 'true'
    environment: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.CDX_ADMIN_CLIENT_ID }}","clientSecret":"${{ secrets.CDX_ADMIN_CLIENT_SECRET }}","subscriptionId":"c85f8672-5f6a-4bf4-b572-b3a3de8e8a00","tenantId":"5581c9a8-168b-45f0-abd4-d375da99bf9f"}'
      
      - name: Get Static Web App Deployment Token
        id: swa
        run: |
          RG_NAME=cloudex-test-rg
          SWA_NAME=cloudex-test-swa
          
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name $SWA_NAME \
            --resource-group $RG_NAME \
            --query "properties.apiKey" -o tsv)
          
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "deployment_token=$DEPLOYMENT_TOKEN" >> $GITHUB_OUTPUT
      
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Frontend (TEST)
        working-directory: frontend
        env:
          NEXT_PUBLIC_AZURE_CLIENT_ID: 17993046-d77a-48e9-81e8-760884beeb47
          NEXT_PUBLIC_AZURE_TENANT_ID: 5581c9a8-168b-45f0-abd4-d375da99bf9f
          NEXT_PUBLIC_AZURE_REDIRECT_URI: https://cloudex.test.flysas.tech
          NEXT_PUBLIC_API_URL: https://cloudex-api.test.flysas.tech
          NEXT_PUBLIC_APPINSIGHTS_CONNECTION_STRING: InstrumentationKey=7b59a20c-2208-4f0d-867b-06c37eecba2e;IngestionEndpoint=https://swedencentral-0.in.applicationinsights.azure.com/;LiveEndpoint=https://swedencentral.livediagnostics.monitor.azure.com/;ApplicationId=17f81ea4-47d6-43c8-9c5d-14b7b6773a08
          NEXT_PUBLIC_ENVIRONMENT: test
        run: npm run build
      
      - name: Copy Static Web App Config
        run: cp frontend/staticwebapp.config.json frontend/out/
      
      - name: Deploy to Static Web App (TEST)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/out"
          skip_app_build: true

  # Approval gate for PROD deployment on main branch
  approve-prod:
    name: Await approval for PROD
    needs: [detect-changes, deploy-backend-test, deploy-frontend-test]
    permissions:
      contents: read
    if: |
      always() &&
      needs.detect-changes.outputs.prod_environment == 'true' &&
      (needs.detect-changes.outputs.backend != 'true' || needs.deploy-backend-test.result == 'success') &&
      (needs.detect-changes.outputs.frontend != 'true' || needs.deploy-frontend-test.result == 'success') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    environment: requires_approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "PROD deployment was approved"

  # Deploy Backend to PROD (requires approval on main branch)
  deploy-backend-prod:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend-test, approve-prod]
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      needs.detect-changes.outputs.prod_environment == 'true' &&
      needs.detect-changes.outputs.backend == 'true' &&
      needs.deploy-backend-test.result == 'success' &&
      needs.approve-prod.result == 'success'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.CDX_ADMIN_CLIENT_ID }}","clientSecret":"${{ secrets.CDX_ADMIN_CLIENT_SECRET }}","subscriptionId":"24832578-1a71-4345-9035-e3979ac8f9a3","tenantId":"5581c9a8-168b-45f0-abd4-d375da99bf9f"}'
      
      - name: Login to ACRs
        run: |
          # Login to TEST ACR to pull image
          az acr login --name $(echo "cloudextestacr.azurecr.io" | cut -d'.' -f1)
          # Login to PROD ACR to push image
          az acr login --name $(echo "cloudexprodacr.azurecr.io" | cut -d'.' -f1)
      
      - name: Tag and Push Production Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          TEST_IMAGE=cloudextestacr.azurecr.io/cloudex-backend
          PROD_IMAGE=cloudexprodacr.azurecr.io/cloudex-backend
          
          # Pull the test image from TEST ACR
          docker pull ${TEST_IMAGE}:${IMAGE_TAG}
          
          # Tag for production ACR
          docker tag ${TEST_IMAGE}:${IMAGE_TAG} ${PROD_IMAGE}:${IMAGE_TAG}
          docker tag ${TEST_IMAGE}:${IMAGE_TAG} ${PROD_IMAGE}:prod-latest
          
          # Push to PROD ACR
          docker push ${PROD_IMAGE}:${IMAGE_TAG}
          docker push ${PROD_IMAGE}:prod-latest
      
      - name: Deploy to Container App (PROD)
        run: |
          IMAGE_TAG=${{ github.sha }}
          ACR_LOGIN=cloudexprodacr.azurecr.io
          RG_NAME=cloudex-prod-rg
          CA_NAME=cloudex-prod-backend-ca
          KV_URI=https://cloudex-prod-kv.vault.azure.net/
          IDENTITY_ID=/subscriptions/24832578-1a71-4345-9035-e3979ac8f9a3/resourcegroups/cloudex-prod-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/cloudex-prod-backend-id
          SUBSCRIPTION_ID=24832578-1a71-4345-9035-e3979ac8f9a3
          SEARCH_ENDPOINT=https://cloudex-shared-search.search.windows.net
          AI_ENDPOINT=https://cloudex-shared-ai.openai.azure.com/
          BACKEND_SP_CLIENT_ID=9dbec738-36a9-48a0-8a7e-d6ab1f175334
          
          # Non-sensitive environment variables
          CORS_ORIGINS="https://cloudex.flysas.tech,https://hangar.flysas.tech"
          

          echo "�🔐 Setting secrets in Container App secret store..."
          az containerapp secret set \
            --name $CA_NAME \
            --resource-group $RG_NAME \
            --secrets \
              openai-api-key="keyvaultref:${KV_URI}secrets/openai-api-key,identityref:${IDENTITY_ID}" \
              azure-search-key="keyvaultref:${KV_URI}secrets/azure-search-key,identityref:${IDENTITY_ID}" \
              redis-url="keyvaultref:${KV_URI}secrets/redis-url,identityref:${IDENTITY_ID}" \
              appinsights-connection-string="keyvaultref:${KV_URI}secrets/appinsights-connection-string,identityref:${IDENTITY_ID}" \
              backend-sp-client-secret="keyvaultref:${KV_URI}secrets/backend-sp-client-secret,identityref:${IDENTITY_ID}"
          
          echo "🚀 Deploying backend to PRODUCTION Container App..."
          az containerapp update \
            --name $CA_NAME \
            --resource-group $RG_NAME \
            --image ${ACR_LOGIN}/cloudex-backend:${IMAGE_TAG} \
            --replace-env-vars \
              "AZURE_TENANT_ID=5581c9a8-168b-45f0-abd4-d375da99bf9f" \
              "AZURE_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}" \
              "AZURE_SERVICE_PRINCIPAL_CLIENT_ID=${BACKEND_SP_CLIENT_ID}" \
              "AZURE_SERVICE_PRINCIPAL_TENANT_ID=5581c9a8-168b-45f0-abd4-d375da99bf9f" \
              "OPENAI_API_BASE=${AI_ENDPOINT}" \
              "OPENAI_DEPLOYMENT_NAME=gpt-5.4" \
              "OPENAI_API_VERSION=2024-12-01-preview" \
              "AZURE_SEARCH_ENDPOINT=${SEARCH_ENDPOINT}" \
              "AZURE_SEARCH_INDEX_NAME=microsoft-docs" \
              "USE_AZURE_SEARCH=true" \
              "RESOURCE_GROUP_NAME=${RG_NAME}" \
              "KEY_VAULT_NAME=cloudex-prod-kv" \
              "KEY_VAULT_URI=${KV_URI}" \
              "REDIS_URL=secretref:redis-url" \
              "WORKSPACE_ID=2a9a2352-3b5a-4873-bf91-7330104a066c" \
              "ADMIN_ROLE_NAME=Admin" \
              "CLOUDFLARE_SUBSCRIPTION_ID=05e3b5d3-530f-4016-bd79-76743afe424f" \
              "CLOUDFLARE_WORKSPACE_ID=/subscriptions/05e3b5d3-530f-4016-bd79-76743afe424f/resourceGroups/sas-weu-mms-prod-rg/providers/Microsoft.OperationalInsights/workspaces/sasweuomworkspace" \
              "CORS_ORIGINS=${CORS_ORIGINS}" \
              "API_BASE_URL=https://cloudex-api.flysas.tech" \
              "CACHE_TTL=300" \
              "PREFETCH_INTERVAL_MINUTES=210" \
              "PREFETCH_CACHE_TTL_SECONDS=14400" \
              "ACCESS_TOKEN_EXPIRE_MINUTES=60" \
              "API_VERSION=v1" \
              "LOG_LEVEL=INFO" \
              "ENVIRONMENT=production" \
              "OPENAI_API_KEY=secretref:openai-api-key" \
              "AZURE_SEARCH_KEY=secretref:azure-search-key" \
              "APPINSIGHTS_CONNECTION_STRING=secretref:appinsights-connection-string" \
              "AZURE_SERVICE_PRINCIPAL_CLIENT_SECRET=secretref:backend-sp-client-secret" \
            --revision-suffix "prod-r${{ github.run_number }}"
      
      - name: Verify Deployment (PROD)
        run: |
          CA_NAME=cloudex-prod-backend-ca
          RG_NAME=cloudex-prod-rg
          
          echo "✅ PRODUCTION Backend deployed successfully!"
          az containerapp show \
            --name $CA_NAME \
            --resource-group $RG_NAME \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv

  # Deploy Frontend to PROD (requires approval on main branch)
  deploy-frontend-prod:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-frontend-test, approve-prod]
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      needs.detect-changes.outputs.prod_environment == 'true' &&
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.deploy-frontend-test.result == 'success' &&
      needs.approve-prod.result == 'success'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.CDX_ADMIN_CLIENT_ID }}","clientSecret":"${{ secrets.CDX_ADMIN_CLIENT_SECRET }}","subscriptionId":"24832578-1a71-4345-9035-e3979ac8f9a3","tenantId":"5581c9a8-168b-45f0-abd4-d375da99bf9f"}'
      
      - name: Get Static Web App Deployment Token
        id: swa
        run: |
          RG_NAME=cloudex-prod-rg
          SWA_NAME=cloudex-prod-swa
          
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            --name $SWA_NAME \
            --resource-group $RG_NAME \
            --query "properties.apiKey" -o tsv)
          
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "deployment_token=$DEPLOYMENT_TOKEN" >> $GITHUB_OUTPUT
      
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Frontend (PROD)
        working-directory: frontend
        env:
          NEXT_PUBLIC_AZURE_CLIENT_ID: 98801f5e-fe0c-4fa9-b0f9-dfa48a4f58b7
          NEXT_PUBLIC_AZURE_TENANT_ID: 5581c9a8-168b-45f0-abd4-d375da99bf9f
          NEXT_PUBLIC_AZURE_REDIRECT_URI: https://cloudex.flysas.tech
          NEXT_PUBLIC_API_URL: https://cloudex-api.flysas.tech
          NEXT_PUBLIC_APPINSIGHTS_CONNECTION_STRING: InstrumentationKey=7b59a20c-2208-4f0d-867b-06c37eecba2e;IngestionEndpoint=https://swedencentral-0.in.applicationinsights.azure.com/;LiveEndpoint=https://swedencentral.livediagnostics.monitor.azure.com/;ApplicationId=17f81ea4-47d6-43c8-9c5d-14b7b6773a08
          NEXT_PUBLIC_ENVIRONMENT: production
        run: npm run build
      
      - name: Copy Static Web App Config
        run: cp frontend/staticwebapp.config.json frontend/out/
      
      - name: Deploy to Static Web App (PROD)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/out"
          skip_app_build: true

  # Deployment Status
  deployment-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend-test, deploy-frontend-test, deploy-backend-prod, deploy-frontend-prod]
    permissions:
      contents: read
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # TEST Environment
          if [[ "${{ needs.detect-changes.outputs.test_environment }}" == "true" ]]; then
            echo "### 🧪 TEST Environment" >> $GITHUB_STEP_SUMMARY
            
            if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" ]]; then
              if [[ "${{ needs.deploy-backend-test.result }}" == "success" ]]; then
                echo "- 🔧 Backend: **SUCCESS** ✅" >> $GITHUB_STEP_SUMMARY
              else
                echo "- 🔧 Backend: **FAILED** ❌" >> $GITHUB_STEP_SUMMARY
              fi
            else
