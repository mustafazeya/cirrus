name: Close Stale PRs

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at 00:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-pr-stale: 14 # 2 weeks before marking PR as stale
          days-before-pr-close: 7 # 1 week after stale before closing (total 3 weeks)
          days-before-issue-stale: 180 # 6 months before marking issues as stale
          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had any activity for 2 weeks.

            **What happens next?**
            - If no further activity occurs, this PR will be automatically closed in 1 week (3 weeks total inactivity).
            - To keep this PR open, simply add a comment or push new commits.
            - The stale label will be automatically removed if activity resumes.

            Thank you for your contributions! 🙏
          close-pr-message: | # Message when closing
            This pull request has been automatically closed due to inactivity for 3 weeks.

            If you'd like to continue working on this, feel free to reopen it or create a new PR.

            Thank you! 👋
          remove-pr-stale-when-updated: true # Remove stale label when activity resumes
          exempt-pr-labels: 'work-in-progress,blocked,on-hold,dont-stale' # Exempt PRs with these labels from being marked stale
          exempt-draft-pr: true # Do not mark draft PRs as stale
